# Deterministic Elixir harness gate for PRs against `development`.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover evidence as PR checks, instead of needing
# a local reviewer to fetch the branch and run the suite.
#
# **cartouche-specific carve-out:** dialyzer is run locally only — cartouche's
# deps PLT (post-`:plt_ignore_apps` trim) exceeds the 16 GB free-runner budget
# during construction. This is NOT a generic "dialyzer doesn't fit in CI"
# claim — most Elixir repos fit comfortably. See the comment below the
# coverage step for the cartouche-specific rationale, and ROADMAP Task 76
# for the restoration paths.
#
# No untrusted-input interpolation — only matrix, runner, beam outputs, hashFiles.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        include:
          - elixir: '1.18.4'
            otp: '27.3'
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      # tag_todo / tag_fixme stay enabled in .credo.exs (see
      # ~/.claude/includes/feedback memory: "TODO credos must stay visible") —
      # they're tracked-debt visibility, not a CI gate. Excluding them here lets
      # the harness fail only on real Credo regressions.
      - name: Credo (strict, excluding TODO/FIXME design tags)
        run: mix credo --strict --ignore TagTODO,TagFIXME

      - name: Doctor (--raise overrides .doctor.exs raise=false to gate CI)
        run: mix doctor --raise

      - name: Sobelow (honors .sobelow-conf, exit=Low)
        run: mix sobelow --config

      # CLAUDE.md tiers: >=80% standard, >=95% critical (signing/crypto/wire-format).
      # Aggregate floor is 85%: meaningful bump from 80%, leaves headroom under
      # current ~87%. Per-module 95% gating for critical paths is a separate ratchet.
      - name: Tests + coverage gate (>=85%)
        run: mix test.json --cover --cover-threshold 85 --summary-only --exclude integration

      # ── cartouche-specific dialyzer carve-out ────────────────────────────
      # Dialyzer is intentionally NOT run here for THIS repo. Cartouche's
      # dep tree includes a heavy generated-API cluster (`google_api_cloud_kms`
      # ~600 generated REST API modules + `goth` + `google_gax` + `tesla` +
      # `jose`); even after `:plt_ignore_apps` in mix.exs trims that cluster,
      # the remaining ~621-module deps PLT OOMs the 16 GB `ubuntu-latest`
      # runner during call-graph + type-signature analysis (run 25319850405,
      # `runner has received a shutdown signal` at 12:52:25).
      #
      # This is a last-resort decision for cartouche specifically — not a
      # blanket "drop dialyzer in CI" recommendation. Default posture for new
      # Elixir repos is to KEEP dialyzer in the harness; remove it only if
      # the same OOM signature shows up in CI for that specific repo. First
      # try `:plt_ignore_apps` to trim heavy generated-API deps; only if that
      # doesn't fit either should the dialyzer step be dropped.
      #
      # Local dev still runs `mix dialyzer.json` against a warm PLT
      # (`priv/plts/`). ROADMAP Task 76 captures restoration paths
      # (separate workflow on a larger runner / nightly cron / more
      # aggressive PLT trim) for if/when cartouche outgrows local-only signal.
      # ─────────────────────────────────────────────────────────────────────
