# Deterministic Elixir harness gate for PRs against `development`.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# No untrusted-input interpolation — only matrix, runner, beam outputs, hashFiles.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        include:
          - elixir: '1.18.4'
            otp: '27.3'
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      # Separate PLT cache: keyed on Elixir+OTP+mix.lock, with version-only
      # restore-keys fallback. Incremental PLT update on dep change is cheap;
      # full PLT rebuild from stdlib OOMs the 7GB GitHub runner. PLT lives at
      # priv/plts/ per the dialyzer: [plt_*_path: ...] pin in mix.exs — keeps
      # PLT outside _build/ so the deps cache (which invalidates on mix.lock)
      # doesn't churn the stable PLT cache.
      - name: Cache dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      # tag_todo / tag_fixme stay enabled in .credo.exs (see
      # ~/.claude/includes/feedback memory: "TODO credos must stay visible") —
      # they're tracked-debt visibility, not a CI gate. Excluding them here lets
      # the harness fail only on real Credo regressions.
      - name: Credo (strict, excluding TODO/FIXME design tags)
        run: mix credo --strict --ignore TagTODO,TagFIXME

      - name: Doctor (--raise overrides .doctor.exs raise=false to gate CI)
        run: mix doctor --raise

      - name: Sobelow (honors .sobelow-conf, exit=Low)
        run: mix sobelow

      # CLAUDE.md tiers: >=80% standard, >=95% critical (signing/crypto/wire-format).
      # Aggregate floor is 85%: meaningful bump from 80%, leaves headroom under
      # current ~87%. Per-module 95% gating for critical paths is a separate ratchet.
      - name: Tests + coverage gate (>=85%)
        run: mix test.json --cover --cover-threshold 85 --summary-only --exclude integration

      # Add 16GB swap before dialyzer steps. ubuntu-latest gives 16GB RAM, but
      # building the deps PLT (881 modules including the heavyweight
      # google_api_cloud_kms generated API) exceeds that on a fresh cache.
      # Swap absorbs the peak; dialyzer-on-swap is slower but completes.
      # Once the PLT is in actions/cache (priv/plts), subsequent runs hit the
      # cache and don't need the swap headroom.
      - name: Add swap (16GB) for dialyzer PLT build
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Build PLT explicitly before the analysis step. On cache hit this is a
      # ~5s no-op. On full miss it costs ~30-60s but with bounded peak memory
      # because dialyzer is only doing PLT construction, not analysis. The
      # Dialyzer step below then runs against a warm PLT at ~5GB peak instead
      # of OOM'ing at ~80GB doing both at once.
      - name: Build PLT (warm or rebuild)
        run: mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer
