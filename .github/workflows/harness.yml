# Deterministic Elixir harness gate for PRs against `development`.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover evidence as PR checks, instead of needing
# a local reviewer to fetch the branch and run the suite.
#
# Dialyzer runs in the harness (restored 2026-06-05, ROADMAP Task 76). The
# 2026-05-04 carve-out blamed an OOM on the 621-module deps PLT size; that was
# wrong. The real cause was `Cartouche.Assembly.compile/1`'s 7-arity tuple_set
# exploding dialyzer's success-typing fixpoint (the ~30 GB bomb fixed under
# Task 103). A clean cold `mix dialyzer` (PLT build + analysis) now peaks at
# ~1.0 GB / ~26s locally — ~15x under the 16 GB `ubuntu-latest` budget. See the
# dialyzer step below the coverage gate.
#
# No untrusted-input interpolation — only matrix, runner, beam outputs, hashFiles.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        include:
          - elixir: '1.18.4'
            otp: '27.3'
    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      # tag_todo / tag_fixme stay enabled in .credo.exs (see
      # ~/.claude/includes/feedback memory: "TODO credos must stay visible") —
      # they're tracked-debt visibility, not a CI gate. Excluding them here lets
      # the harness fail only on real Credo regressions.
      - name: Credo (strict, excluding TODO/FIXME design tags)
        run: mix credo --strict --ignore TagTODO,TagFIXME

      - name: Doctor (--raise overrides .doctor.exs raise=false to gate CI)
        run: mix doctor --raise

      # ── Sobelow drift check ──────────────────────────────────────────────
      # `.sobelow-skips` is a list of line-fingerprint hashes for known-acceptable
      # findings. Every PR that shifts lines in `lib/mix/cartouche.gen.ex` (heavy
      # File.* macro callsites, see lines 722, 920, 1062, 1100, 1101 of that file)
      # invalidates fingerprints, and the Sobelow step below would fail until
      # `.sobelow-skips` is regenerated.
      #
      # This step regenerates and diffs against the committed file. If drift,
      # fail loudly with the diff inline. The local reviewer (commit-review skill,
      # Step 14) applies the regen on `main` after merge as part of the post-merge
      # bookkeeping commit — agents never touch `.sobelow-skips`. Auto-commit-back
      # from CI would require write tokens; we trade that security tradeoff for
      # a single visible drift diff that commit-review handles deterministically.
      - name: Sobelow drift check (.sobelow-skips fingerprints)
        run: |
          cp .sobelow-skips .sobelow-skips.committed
          mix sobelow --mark-skip-all
          if ! diff -q .sobelow-skips.committed .sobelow-skips > /dev/null; then
            echo "::error::.sobelow-skips drift detected — line fingerprints stale."
            echo ""
            echo "The committed .sobelow-skips no longer matches what 'mix sobelow --mark-skip-all'"
            echo "produces against the current source. This usually means a PR shifted lines in a"
            echo "file referenced by fingerprint (e.g. lib/mix/cartouche.gen.ex)."
            echo ""
            echo "Fix path:"
            echo "  Local: 'mix sobelow --mark-skip-all && git add .sobelow-skips' on main after merge."
            echo "  Or: commit-review skill (Step 14) applies the regen automatically as part of"
            echo "  post-merge bookkeeping. Agents (Codex/Cursor) should not touch .sobelow-skips."
            echo ""
            echo "--- diff (committed vs regenerated) ---"
            diff .sobelow-skips.committed .sobelow-skips || true
            exit 1
          fi
          echo "Sobelow skips fingerprints in sync with source."

      - name: Sobelow (honors .sobelow-conf, exit=Low)
        run: mix sobelow --config

      # CLAUDE.md tiers: >=80% standard, >=95% critical (signing/crypto/wire-format).
      # Aggregate floor is 85%: meaningful bump from 80%, leaves headroom under
      # current ~87%. Per-module 95% gating for critical paths is a separate ratchet.
      - name: Tests + coverage gate (>=85%)
        run: mix test.json --cover --cover-threshold 85 --summary-only --exclude integration

      # ── Dialyzer (restored 2026-06-05, Task 76) ──────────────────────────
      # Runs in MIX_ENV=dev: dialyxir builds the `…_deps-dev.plt` PLT and the
      # repo's `dialyzer.json`/`dialyzer` preferred env is :dev. `mix dialyzer`
      # exits non-zero on any warning, so this gates. `priv/plts/` is pinned
      # outside `_build/` (see mix.exs dialyzer config) precisely so it caches
      # here — cold build is ~1.0 GB / ~26s, cached is seconds.
      - name: Cache dialyzer PLT (priv/plts)
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Dialyzer (cold ~1.0 GB peak / ~26s — Task 76)
        env:
          MIX_ENV: dev
        run: mix dialyzer
      # ─────────────────────────────────────────────────────────────────────
